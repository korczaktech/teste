name: Validate Zeus code
on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "frontend/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "frontend/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate API syntax
        run: node --check server.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend and validate inline JavaScript
        working-directory: frontend
        run: npm run build
