name: Import OpenJarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import OpenJarvis source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/open-jarvis/OpenJarvis.git /tmp/OpenJarvis
          # Preserve destination workflows because this integration token cannot
          # create or update workflow files in .github/workflows.
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/***' /tmp/OpenJarvis/ "$GITHUB_WORKSPACE/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import OpenJarvis upstream"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
